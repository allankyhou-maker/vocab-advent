<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單字大冒險 - 題庫中央控制台</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .admin-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        h1 { color: #2c3e50; margin-top: 0; }
        p { color: #7f8c8d; line-height: 1.6; margin-bottom: 25px; }
        
        .upload-area { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            border: 2px dashed #3498db; 
            border-radius: 10px; 
            padding: 30px; 
            background: #ebf5fb; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-bottom: 20px; 
            box-sizing: border-box;
            width: 100%;
        }
        .upload-area:hover { background: #d6eaf8; }
        .upload-area.disabled { border-color: #bdc3c7; background: #fdfdfd; cursor: not-allowed; opacity: 0.6; }
        .upload-area input { display: none; }
        
        .status { padding: 15px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; display: none; }
        .status.success { background: #d4edda; color: #155724; display: block; }
        .status.error { background: #f8d7da; color: #721c24; display: block; }
        .status.loading { background: #fff3cd; color: #856404; display: block; }

        .upload-btn { background-color: #3498db; color: white; border: none; padding: 12px 25px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; box-shadow: 0 4px 0 #2980b9; transition: 0.1s; }
        .upload-btn:active { transform: translateY(4px); box-shadow: none; }
        .upload-btn:disabled { background: #bdc3c7; box-shadow: none; cursor: not-allowed; }
        
        #file-name-display { font-size: 14px; color: #2980b9; margin-top: 10px; font-weight: bold; }
        #auth-badge { display: inline-block; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 15px; }
        .auth-checking { background: #f1c40f; color: #835100; }
        .auth-ok { background: #2ecc71; color: white; }
        .auth-fail { background: #e74c3c; color: white; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h1>⚙️ 題庫中央控制台</h1>
        <div id="auth-badge" class="auth-checking">🔍 正在驗證管理員身分...</div>
        <p>請上傳最新的 <b>master_wordbank.json</b> 檔案。<br>系統將自動覆蓋雲端題庫，孩子們重新整理網頁即可看到新單字！</p>
        
        <label class="upload-area disabled" id="drop-zone">
            <div style="font-size: 40px; margin-bottom: 10px;">📁</div>
            <div style="font-size: 18px; font-weight: bold; color: #3498db;">點擊選擇 JSON 檔案</div>
            <div id="file-name-display">尚未選擇檔案</div>
            <input type="file" id="json-upload" accept=".json" disabled>
        </label>

        <div id="status-message" class="status"></div>
        <button id="submit-btn" class="upload-btn" disabled>發射至雲端！🚀</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";
        // 💡 新增：引入 Firebase Auth 模組
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXjVOM0EPHB6ZKlizyI-T6Y8satD8llEo",
            authDomain: "vocab-adventure-d6a5a.firebaseapp.com",
            projectId: "vocab-adventure-d6a5a",
            storageBucket: "vocab-adventure-d6a5a.firebasestorage.app",
            messagingSenderId: "704154289545",
            appId: "1:704154289545:web:8226afd8db826cc19f8d58"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app); // 💡 初始化 Auth

        let parsedData = null;
        let isAdminReady = false; // 紀錄是否為合法管理員

        const fileInput = document.getElementById('json-upload');
        const dropZone = document.getElementById('drop-zone');
        const submitBtn = document.getElementById('submit-btn');
        const statusMsg = document.getElementById('status-message');
        const fileNameDisplay = document.getElementById('file-name-display');
        const authBadge = document.getElementById('auth-badge');

        // 💡 0. 監聽登入狀態 (最關鍵的一步！)
        onAuthStateChanged(auth, (user) => {
            if (user && !user.isAnonymous) {
                // 成功抓到已綁定 Google 的帳號
                authBadge.className = "auth-ok";
                authBadge.innerText = `✅ 管理員已連線 (UID: ${user.uid.substring(0,5)}...)`;
                isAdminReady = true;
                
                // 解鎖上傳區塊
                fileInput.disabled = false;
                dropZone.classList.remove('disabled');
            } else {
                // 未登入，或是只使用訪客模式
                authBadge.className = "auth-fail";
                authBadge.innerText = "❌ 權限不足";
                showStatus("error", "⚠️ 偵測到您尚未登入或正使用訪客模式。請先回到遊戲主畫面完成「綁定帳號」後再回來！");
                isAdminReady = false;
                
                // 鎖死上傳區塊
                fileInput.disabled = true;
                dropZone.classList.add('disabled');
                submitBtn.disabled = true;
            }
        });

        // 1. 監聽檔案選擇
        fileInput.addEventListener('change', function(e) {
            if (!isAdminReady) return; // 沒權限不給選

            const file = e.target.files[0];
            if (!file) return;

            fileNameDisplay.innerText = `📄 已選取：${file.name}`;
            const reader = new FileReader();

            reader.onload = function(event) {
                try {
                    parsedData = JSON.parse(event.target.result);
                    if (typeof parsedData !== 'object' || parsedData === null) throw new Error("檔案格式不正確");
                    
                    showStatus("success", `✅ 解析成功！共讀取到 ${Object.keys(parsedData).length} 個題庫類別。`);
                    submitBtn.disabled = false;
                } catch (error) {
                    showStatus("error", "❌ JSON 解析失敗，請檢查檔案格式是否正確！");
                    submitBtn.disabled = true;
                }
            };
            reader.readAsText(file);
        });

        // 2. 點擊發射按鈕
        submitBtn.addEventListener('click', async () => {
            if (!parsedData || !isAdminReady) return;
            
            submitBtn.disabled = true;
            submitBtn.innerText = "上傳中...";
            showStatus("loading", "⏳ 正在與 Firebase 連線同步中...");

            try {
                await setDoc(doc(db, "wordBanks", "all_data"), parsedData);
                
                showStatus("success", "🎉 發射成功！雲端題庫已更新完畢。");
                setTimeout(() => {
                    submitBtn.innerText = "發射至雲端！🚀";
                    submitBtn.disabled = false;
                }, 2000);
            } catch (error) {
                console.error(error);
                showStatus("error", "❌ 上傳失敗：無權限或網路錯誤。請確認您的 UID 是否已加入 Firebase 規則中。");
                submitBtn.innerText = "重試一次";
                submitBtn.disabled = false;
            }
        });

        function showStatus(type, message) {
            statusMsg.className = `status ${type}`;
            statusMsg.innerText = message;
        }
    </script>
</body>
</html>
